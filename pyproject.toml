[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aiida-eon"
version = "0.1.0"
description = "AiiDA plugin for eOn (eonclient: config.ini + .con + results.dat)"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Rohit Goswami", email = "rog32@hi.is" }]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AiiDA",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
    "aiida-core>=2.4,<3",
]

[project.optional-dependencies]
tests = [
    "pytest>=7",
]
docs = [
    "sphinx",
]

[project.urls]
Homepage = "https://github.com/HaoZeke/aiida-eon"
Source = "https://github.com/HaoZeke/aiida-eon"

[project.entry-points."aiida.calculations"]
eon = "aiida_eon.calculations:EonCalculation"

[project.entry-points."aiida.parsers"]
eon = "aiida_eon.parsers:EonParser"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning:aiida:",
    "ignore::DeprecationWarning:plumpy:",
]
