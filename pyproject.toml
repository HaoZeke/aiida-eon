[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aiida-eon"
version = "0.3.2"
description = "AiiDA 2 plugin for eOn: eonclient jobs, CON data, and workchains"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Rohit Goswami", email = "rog32@hi.is" }]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AiiDA",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
    "aiida-core>=2.6,<3",
    "rgpycrumbs>=1.9",
    "eon-schema>=0.2.0",
    "chemparseplot>=1.8",
]

[project.optional-dependencies]
tests = [
    "pytest>=7",
]
docs = [
    "sphinx",
]

[project.urls]
Homepage = "https://github.com/HaoZeke/aiida-eon"
Source = "https://github.com/HaoZeke/aiida-eon"
Documentation = "https://github.com/HaoZeke/aiida-eon#readme"
Issues = "https://github.com/HaoZeke/aiida-eon/issues"

[project.entry-points."aiida.calculations"]
eon = "aiida_eon.calculations:EonCalculation"

[project.entry-points."aiida.parsers"]
eon = "aiida_eon.parsers:EonParser"

[project.entry-points."aiida.workflows"]
"eon.minimize" = "aiida_eon.workflows.minimize:EonMinimizeWorkChain"
"eon.neb" = "aiida_eon.workflows.neb:EonNebWorkChain"
"eon.saddle" = "aiida_eon.workflows.saddle:EonSaddleSearchWorkChain"
"eon.process_search" = "aiida_eon.workflows.process_search:EonProcessSearchWorkChain"
"eon.prefactor" = "aiida_eon.workflows.prefactor:EonPrefactorWorkChain"
"eon.akmc" = "aiida_eon.workflows.akmc:EonAkmcWorkChain"

[project.entry-points."aiida.data"]
"eon.con" = "aiida_eon.data.con:ConData"

[project.entry-points."aiida.cmdline.data"]
eon = "aiida_eon.cli:data_cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning:aiida:",
    "ignore::DeprecationWarning:plumpy:",
]
